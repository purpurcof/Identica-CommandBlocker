[versions]
identica = "3.0.1"
configura = "2.1.0"
keystone = "1.0.0"
guice = "7.0.0"
lombok = "1.18.48"
annotations = "26.1.0"
adventure = "5.2.0"
bungeecord = "26.1-R0.1-SNAPSHOT"
velocity = "4.2.1-SNAPSHOT"
junit = "6.1.3"
junit-platform = "6.1.3"
mockito = "5.24.0"
shadow = "9.6.1"
anvil = "dev-376797f"
# the models of Identica's messages refer to Commandant's message models, which the API only declares compileOnly
commandant = "1.0.0"

[libraries]
identica-api = { group = "me.whereareiam.identica", name = "api", version.ref = "identica" }
configura = { group = "me.whereareiam", name = "configura", version.ref = "configura" }
keystone = { group = "me.whereareiam", name = "keystone", version.ref = "keystone" }
guice = { group = "com.google.inject", name = "guice", version.ref = "guice" }
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
adventure = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-minimessage = { group = "net.kyori", name = "adventure-text-minimessage", version.ref = "adventure" }
bungeecord = { group = "net.md-5", name = "bungeecord-api", version.ref = "bungeecord" }
velocity = { group = "com.velocitypowered", name = "velocity-api", version.ref = "velocity" }

# test
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }


shadow-gradle-plugin = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }

# live tests
commandant = { group = "me.whereareiam", name = "commandant", version.ref = "commandant" }
anvil-protocol-mcprotocol = { group = "me.whereareiam.anvil", name = "protocol-mcprotocol", version.ref = "anvil" }

[plugins]
anvil = { id = "me.whereareiam.anvil", version.ref = "anvil" }
anvil-junit = { id = "me.whereareiam.anvil.junit", version.ref = "anvil" }
anvil-capability-default = { id = "me.whereareiam.anvil.capability.default", version.ref = "anvil" }
anvil-platform-paper = { id = "me.whereareiam.anvil.platform.paper", version.ref = "anvil" }
anvil-platform-velocity = { id = "me.whereareiam.anvil.platform.velocity", version.ref = "anvil" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
