name: Release build

on:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to rebuild, for example v1.0.0
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.details.outputs.name }}
      version: ${{ steps.details.outputs.version }}
      release-tag: ${{ steps.release.outputs.release-tag }}
      release-url: ${{ steps.release.outputs.release-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release-tag || github.ref }}

      - name: Resolve release metadata
        id: release
        uses: actions/github-script@v7
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          script: |
            if (context.eventName === "release") {
              const release = context.payload.release;
              core.setOutput("release-tag", release.tag_name);
              core.setOutput("release-url", release.html_url || "");
              return;
            }

            const tag = process.env.INPUT_RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            core.setOutput("release-tag", release.tag_name);
            core.setOutput("release-url", release.html_url || "");

      - name: Extract project details
        id: details
        shell: bash
        run: |
          echo "name=$(grep 'rootProject.name' settings.gradle.kts | awk -F "=" '{print $2}' | tr -d ' \"\n')" >> $GITHUB_OUTPUT
          echo "version=${{ steps.release.outputs.release-tag }}" | sed 's/^version=v/version=/' >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release-tag }}

      - name: Build project
        uses: ./.github/actions/gradle-build
        with:
          gradle-command: ./gradlew --no-daemon test :velocity:shadowJar :bungeecord:shadowJar

      - name: Create output directory
        shell: bash
        run: mkdir output

      - name: Move jars
        shell: bash
        run: |
          mv velocity/build/libs/*.jar output/${{ needs.prepare.outputs.name }}-Velocity-${{ needs.prepare.outputs.version }}.jar
          mv bungeecord/build/libs/*.jar output/${{ needs.prepare.outputs.name }}-BungeeCord-${{ needs.prepare.outputs.version }}.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/') }}
        with:
          files: |
            output/${{ needs.prepare.outputs.name }}-Velocity-${{ needs.prepare.outputs.version }}.jar
            output/${{ needs.prepare.outputs.name }}-BungeeCord-${{ needs.prepare.outputs.version }}.jar

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Release Artifacts
          path: output/
